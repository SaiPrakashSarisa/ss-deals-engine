name: ss-deals-engine

services:
  postgres:
    image: postgres:17
    container_name: ss-deals-postgres
    environment:
      POSTGRES_USER: ssdeals
      POSTGRES_PASSWORD: ssdeals
      POSTGRES_DB: ssdeals
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    image: ss-deals-engine:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-deals-api
    command: ['node', 'dist/api/main.js']
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://ssdeals:ssdeals@postgres:5432/ssdeals
      LOG_LEVEL: info
      TZ: Asia/Kolkata
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((response)=>process.exit(response.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    restart: unless-stopped

  worker:
    image: ss-deals-engine:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-deals-worker
    command: ['node', 'dist/worker/main.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://ssdeals:ssdeals@postgres:5432/ssdeals
      LOG_LEVEL: info
      TZ: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const fs=require('node:fs'); const age=Date.now()-fs.statSync('/tmp/ss-deals-worker-heartbeat').mtimeMs; process.exit(age<=120000?0:1);",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
