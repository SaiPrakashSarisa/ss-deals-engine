name: ss-deals-engine

services:
  postgres:
    image: postgres:17
    container_name: ss-deals-postgres
    environment:
      POSTGRES_USER: ssdeals
      POSTGRES_PASSWORD: ssdeals
      POSTGRES_DB: ssdeals
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    image: ss-deals-engine:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-deals-api
    command: ['node', 'dist/api/main.js']
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://ssdeals:ssdeals@postgres:5432/ssdeals
      LOG_LEVEL: info
      TZ: Asia/Kolkata
      AMAZON_TAG: ${AMAZON_TAG:?Set AMAZON_TAG in .env}
      SHORT_LINK_HOSTS: ${SHORT_LINK_HOSTS:-amzn.to,link.amazon}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      PUBLISHING_ENABLED: ${PUBLISHING_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHANNEL: ${TELEGRAM_CHANNEL:-}
      TELEGRAM_TIMEOUT_MS: ${TELEGRAM_TIMEOUT_MS:-15000}
      DAILY_POST_LIMIT: ${DAILY_POST_LIMIT:-8}
      LINK_STYLE: ${LINK_STYLE:-text}
      POST_FOOTER: ${POST_FOOTER:-}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((response)=>process.exit(response.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  worker:
    image: ss-deals-engine:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-deals-worker
    command: ['node', 'dist/worker/main.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://ssdeals:ssdeals@postgres:5432/ssdeals
      LOG_LEVEL: info
      TZ: Asia/Kolkata
      AMAZON_TAG: ${AMAZON_TAG:?Set AMAZON_TAG in .env}
      SHORT_LINK_HOSTS: ${SHORT_LINK_HOSTS:-amzn.to,link.amazon}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      PUBLISHING_ENABLED: ${PUBLISHING_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHANNEL: ${TELEGRAM_CHANNEL:-}
      TELEGRAM_TIMEOUT_MS: ${TELEGRAM_TIMEOUT_MS:-15000}
      DAILY_POST_LIMIT: ${DAILY_POST_LIMIT:-8}
      LINK_STYLE: ${LINK_STYLE:-text}
      POST_FOOTER: ${POST_FOOTER:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const fs=require('node:fs'); const age=Date.now()-fs.statSync('/tmp/ss-deals-worker-heartbeat').mtimeMs; process.exit(age<=120000?0:1);",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
    restart: unless-stopped

  web:
    image: ss-deals-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ss-deals-web
    environment:
      NODE_ENV: production
      API_URL: http://api:3000
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports:
      - '${WEB_BIND:-127.0.0.1}:3001:3001'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/login').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s
    restart: unless-stopped

  quickpost:
    profiles: ['quickpost']
    image: ss-deals-quickpost:local
    build:
      context: .
      dockerfile: apps/quickpost/Dockerfile
    container_name: ss-deals-quickpost
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Kolkata}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHANNEL: ${TELEGRAM_CHANNEL:-}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:-}
      AMAZON_TAG: ${AMAZON_TAG:-}
      DAILY_POST_LIMIT: ${DAILY_POST_LIMIT:-8}
      DATA_DIR: /app/data
    volumes:
      - quickpost_data:/app/data
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  quickpost_data:
  uploads_data:
