# No source bind mounts. Export POSTGRES_PASSWORD and COMPOSE_DATABASE_URL first.
# COMPOSE_DATABASE_URL must use the Compose hostname `postgres`, not 127.0.0.1.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

  api:
    environment:
      NODE_ENV: production
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL to postgres://USER:PASSWORD@postgres:5432/DB}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
    volumes:
      - uploads_data:/app/uploads

  worker:
    environment:
      NODE_ENV: production
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL to postgres://USER:PASSWORD@postgres:5432/DB}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
    volumes:
      - uploads_data:/app/uploads
